name: E wall Smoke

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: App smoke checks (landing, JSON-LD, outbound)
        shell: bash
        run: |
          set -euo pipefail
          npm run start &> .next.log &
          PID=$!
          cleanup() { kill $PID || true; }
          trap cleanup EXIT

          echo "Waiting for server..."
          for i in {1..90}; do
            if curl -sf "http://localhost:3000" > /dev/null; then break; fi
            sleep 1
          done

          echo "Check: /BrandA/down returns 200"
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000/BrandA/down")
          echo "Status: $code"
          test "$code" = "200" || { echo "Server log:"; tail -n +1 .next.log || true; exit 1; }

          echo "Check: JSON-LD present on landing"
          page=$(curl -s --compressed "http://localhost:3000/BrandA/down" | tr -d '\r')
          echo "$page" | grep -qi 'application/ld+json' || { echo "First 200 lines of HTML:"; echo "$page" | sed -n '1,200p'; echo "Server log:"; tail -n +1 .next.log || true; exit 1; }
          echo "JSON-LD OK"

          echo "Check: /api/out redirect contains subId (GET header dump)"
          loc=$(curl -s -D - -o /dev/null "http://localhost:3000/api/out?to=https://example.com&pid=ex-001" | tr -d '\r' | awk 'tolower($0) ~ /^location:/ {sub(/^[^:]*:[[:space:]]*/, "", $0); print; exit}')
          echo "Location: $loc"
          echo "$loc" | grep -q 'subId=ewall_ex-001' || { echo "Server log:"; tail -n +1 .next.log || true; exit 1; }
          echo "Redirect OK"

      - name: Feed parser smoke
        run: |
          npx --yes tsx --version || npm i -D tsx
          npx tsx scripts/parseFeeds.ts data/sample-products.json out/products.json
          test -f out/products.json